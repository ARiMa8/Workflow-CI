name: MLflow CI - Credit Scoring

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  IMAGE_NAME: arima88/credit-scoring-msml
  ARTIFACT_BRANCH: model-artifacts

jobs:
  train-build-push:
    name: Train, Store Artifacts, Build Docker
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r MLProject/requirements.txt

      - name: Run MLflow Project retraining
        run: |
          mlflow run MLProject --env-manager=local

      - name: Upload MLflow artifacts to GitHub Actions
        uses: actions/upload-artifact@v4
        with:
          name: credit-scoring-mlflow-artifacts-${{ github.run_number }}
          path: |
            MLProject/model_output
            mlruns
          if-no-files-found: error
          retention-days: 30

      - name: Prepare artifact branch payload
        run: |
          mkdir -p artifact_branch/latest
          cp -R MLProject/model_output artifact_branch/latest/model_output
          cp -R mlruns artifact_branch/latest/mlruns
          {
            echo "# Credit Scoring Model Artifacts"
            echo ""
            echo "- Source commit: ${{ github.sha }}"
            echo "- Workflow run: ${{ github.run_number }}"
            echo "- Docker image: $IMAGE_NAME:${{ github.sha }}"
            echo "- Latest image: $IMAGE_NAME:latest"
          } > artifact_branch/README.md

      - name: Publish artifacts to model-artifacts branch
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: ${{ env.ARTIFACT_BRANCH }}
          publish_dir: ./artifact_branch
          force_orphan: true

      - name: Build Docker image with MLflow
        run: |
          mlflow models build-docker -m MLProject/model_output/model -n $IMAGE_NAME:${{ github.sha }}
          docker tag $IMAGE_NAME:${{ github.sha }} $IMAGE_NAME:latest

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push Docker image to Docker Hub
        run: |
          docker push $IMAGE_NAME:${{ github.sha }}
          docker push $IMAGE_NAME:latest
